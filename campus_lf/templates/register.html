<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register — Campus L&F</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0f14;--surface:#151820;--surface2:#1c202c;--border:#242838;--accent:#f5c842;--text:#e8eaf0;--muted:#7b8099;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
a{color:var(--accent);text-decoration:none;}
.container{width:100%;max-width:420px;padding:1rem;}
.logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:2rem;}
.logo span{color:var(--accent);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2rem;}
h2{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:.3rem;}
p.sub{color:var(--muted);font-size:.875rem;margin-bottom:1.75rem;}
.form-group{margin-bottom:1rem;}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem;font-weight:500;}
input{width:100%;background:var(--surface2);border:2px solid #01796F;color:var(--text);padding:.65rem .9rem;border-radius:7px;font-size:.9rem;font-family:inherit;transition:border-color .15s;}
input:focus{outline:none;border-color:#01796F;}
.btn{width:100%;padding:.7rem;border-radius:7px;font-size:.95rem;font-weight:600;background:var(--accent);color:#FCFBF4;border:none;cursor:pointer;font-family:'Syne',sans-serif;transition:opacity .15s;margin-top:.5rem;}
.btn:hover{opacity:.85;}
.footer-link{text-align:center;margin-top:1.25rem;font-size:.85rem;color:var(--muted);}
.flash{padding:.65rem .9rem;border-radius:7px;margin-bottom:1rem;font-size:.85rem;background:#7f1d1d22;border:1px solid #ef444444;color:#fca5a5;}
</style>
</head>
<body>
<div class="container">
  <div class="logo">Campus <span>L&F</span></div>
  <div class="card">
    <h2>Create account</h2>
    <p class="sub">Join the campus lost & found network</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Your full name" required/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@vignan.ac.in" required/>
      </div>
      <div class="form-group">
        <label>Phone (optional)</label>
        <input type="tel" name="phone" placeholder="9XXXXXXXXX"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="footer-link">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
